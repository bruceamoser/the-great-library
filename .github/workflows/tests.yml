name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      # Named separately so a search regression is obvious in the checks list.
      # Every rule is enforced; there is no skip list.
      - name: Search performance regression checks
        run: python -m unittest discover -s tests -p 'test_performance.py' -v
